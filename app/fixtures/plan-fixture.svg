<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <!--
    SYNTHETIC CALIBRATION FIXTURE. This is NOT the Section Haus plan and not any ArchDaily drawing.
    Generated by Coral Concrete (app/fixtures) so the trace workflow and its tests have a drawing with
    KNOWN dimensions. Scale: 100 px = 1 m (0.01 m/px). The 5 m scale bar spans exactly 500 px.
    Outer walls: 12.00 x 8.00 m to centrelines, 200 thick. Columns 300 x 300 at (3,4) and (9,4) m.
    Door 900 wide at 1.0 m along the south wall; window 1200 wide at 6.0 m along the south wall.
    Origin mark (world 0,0) is the SW outer wall centreline intersection at pixel (150, 850);
    the south wall centreline runs from (150, 850) to (1350, 850) = 1200 px = 12 m.
  -->
  <rect width="1400" height="1000" fill="#fbfaf7"/>
  <text x="700" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#b03a2e" font-weight="bold">SYNTHETIC CALIBRATION FIXTURE — not Section Haus, not an ArchDaily drawing</text>
  <text x="700" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">Coral Concrete test fixture · ground floor plan · 100 px = 1 m · dimensions in mm</text>
  <!-- outer walls as 20 px (200 mm) double lines centred on the 12 x 8 m rectangle -->
  <g fill="none" stroke="#222" stroke-width="2">
    <rect x="190" y="40" width="1220" height="820" transform="translate(0,0)" visibility="hidden"/>
    <!-- centrelines: x 200..1400? no: outer rectangle centreline from (200,850) to (1400,50) would exceed; use 12 m = 1200 px: x 200..1400 clipped -> shift: x 150..1350 -->
  </g>
  <g fill="#333" stroke="none">
    <!-- south wall centreline y=850, x 150..1350 ; north y=50 ; west x=150 ; east x=1350 -->
    <rect x="140" y="840" width="1220" height="20"/>
    <rect x="140" y="40" width="1220" height="20"/>
    <rect x="140" y="40" width="20" height="820"/>
    <rect x="1340" y="40" width="20" height="820"/>
    <!-- internal wall centreline x=750 from y=50 to y=450 (4 m), 150 thick -->
    <rect x="742.5" y="50" width="15" height="400"/>
    <!-- columns 300 x 300 at world (3,4) -> px (450,450) and (9,4) -> px (1050,450) -->
    <rect x="435" y="435" width="30" height="30"/>
    <rect x="1035" y="435" width="30" height="30"/>
  </g>
  <!-- openings cut from the south wall: door 900 at 1.0 m -> px x 250..340 ; window 1200 at 6.0 m -> px x 750..870 -->
  <rect x="250" y="838" width="90" height="24" fill="#fbfaf7"/>
  <rect x="750" y="838" width="120" height="24" fill="#fbfaf7"/>
  <g stroke="#222" stroke-width="1.5" fill="none">
    <path d="M250 850 A90 90 0 0 1 340 760" />
    <line x1="750" y1="850" x2="870" y2="850"/>
    <line x1="750" y1="846" x2="870" y2="846" stroke-dasharray="4 3"/>
  </g>
  <!-- room labels -->
  <g font-family="sans-serif" font-size="20" fill="#444" text-anchor="middle">
    <text x="450" y="260">LIVING</text><text x="1050" y="260">KITCHEN</text><text x="750" y="660">TERRACE SLAB</text>
  </g>
  <!-- dimensions -->
  <g font-family="sans-serif" font-size="16" fill="#1a4d8f" stroke="#1a4d8f">
    <line x1="150" y1="910" x2="1350" y2="910" stroke-width="1"/>
    <line x1="150" y1="900" x2="150" y2="920" stroke-width="1"/><line x1="1350" y1="900" x2="1350" y2="920" stroke-width="1"/>
    <text x="750" y="935" text-anchor="middle" stroke="none">12000</text>
    <line x1="80" y1="50" x2="80" y2="850" stroke-width="1"/>
    <line x1="70" y1="50" x2="90" y2="50" stroke-width="1"/><line x1="70" y1="850" x2="90" y2="850" stroke-width="1"/>
    <text x="60" y="455" text-anchor="middle" stroke="none" transform="rotate(-90 60 455)">8000</text>
  </g>
  <!-- scale bar: exactly 500 px = 5 m, from (700, 970) to (1200, 970) -->
  <g font-family="sans-serif" font-size="16" fill="#111">
    <rect x="700" y="962" width="100" height="8" fill="#111"/><rect x="800" y="962" width="100" height="8" fill="#fff" stroke="#111"/>
    <rect x="900" y="962" width="100" height="8" fill="#111"/><rect x="1000" y="962" width="100" height="8" fill="#fff" stroke="#111"/>
    <rect x="1100" y="962" width="100" height="8" fill="#111"/>
    <text x="700" y="990" text-anchor="middle">0</text><text x="950" y="990" text-anchor="middle">2.5 m</text><text x="1200" y="990" text-anchor="middle">5 m</text>
  </g>
  <!-- origin mark -->
  <g stroke="#b03a2e" stroke-width="1.5" fill="none"><circle cx="150" cy="850" r="8"/><line x1="138" y1="850" x2="162" y2="850"/><line x1="150" y1="838" x2="150" y2="862"/></g>
  <text x="170" y="885" font-family="sans-serif" font-size="14" fill="#b03a2e">(0,0)</text>
  <text x="1380" y="990" text-anchor="end" font-family="sans-serif" font-size="12" fill="#999">fixture v1 · app/fixtures/plan-fixture.svg</text>
</svg>
